services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sample}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sample}
      POSTGRES_DB: ${POSTGRES_DB:-sample_transfer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sample} -d ${POSTGRES_DB:-sample_transfer}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sample}:${POSTGRES_PASSWORD:-sample}@db:5432/${POSTGRES_DB:-sample_transfer}
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
